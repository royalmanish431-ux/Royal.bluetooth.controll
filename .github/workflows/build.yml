name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Initialize Android Platform Files
        run: flutter create --platforms=android --project-name hc05_rover_controller .

      - name: Configure Continuous SpeechRecognizer, BLE UART + CRLF & Permissions
        run: |
          flutter pub get
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" \/>\n        <\/intent>\n    <\/queries>\n    <application/' "$MANIFEST"

          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          cat << 'EOF' > "$MAIN_KT"
          package com.example.hc05_rover_controller

          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.example.hc05_rover_controller/bluetooth"
              private var methodChannel: MethodChannel? = null

              private var bluetoothGatt: BluetoothGatt? = null
              private var txCharacteristic: BluetoothGattCharacteristic? = null
              private var pendingConnectResult: MethodChannel.Result? = null
              private var isGattReady = false

              private var speechRecognizer: SpeechRecognizer? = null
              private var isContinuousListening = false
              private val mainHandler = Handler(Looper.getMainLooper())

              @SuppressLint("MissingPermission")
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)

                  methodChannel?.setMethodCallHandler { call, result ->
                      val manager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                      val adapter: BluetoothAdapter? = manager.adapter

                      when (call.method) {
                          "getBondedDevices" -> {
                              if (adapter == null || !adapter.isEnabled) {
                                  result.error("BT_OFF", "Bluetooth is disabled", null)
                                  return@setMethodCallHandler
                              }
                              val list = adapter.bondedDevices.map { device ->
                                  mapOf("name" to (device.name ?: "Unknown"), "address" to device.address)
                              }
                              result.success(list)
                          }

                          "startContinuousVoice" -> {
                              if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                                  result.error("NO_SPEECH", "Speech recognition unavailable", null)
                                  return@setMethodCallHandler
                              }
                              isContinuousListening = true
                              startListeningCycle()
                              result.success(true)
                          }

                          "stopContinuousVoice" -> {
                              isContinuousListening = false
                              try {
                                  speechRecognizer?.stopListening()
                                  speechRecognizer?.destroy()
                              } catch (_: Exception) {}
                              speechRecognizer = null
                              result.success(true)
                          }

                          "connect" -> {
                              val address = call.argument<String>("address")
                              if (adapter == null || address == null) {
                                  result.error("INVALID", "Adapter or address missing", null)
                                  return@setMethodCallHandler
                              }

                              try {
                                  bluetoothGatt?.disconnect()
                                  bluetoothGatt?.close()
                              } catch (_: Exception) {}

                              bluetoothGatt = null
                              txCharacteristic = null
                              isGattReady = false
                              pendingConnectResult = result

                              val device: BluetoothDevice = adapter.getRemoteDevice(address)
                              val callback = object : BluetoothGattCallback() {
                                  override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                                      if (newState == BluetoothProfile.STATE_CONNECTED) {
                                          gatt.discoverServices()
                                      } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                                          isGattReady = false
                                          txCharacteristic = null
                                          val res = pendingConnectResult
                                          pendingConnectResult = null
                                          if (res != null) {
                                              runOnUiThread { res.error("BLE_DISC", "BLE disconnected (status $status)", null) }
                                          }
                                      }
                                  }

                                  override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                                      if (status == BluetoothGatt.GATT_SUCCESS) {
                                          var foundChar: BluetoothGattCharacteristic? = null

                                          // 1. Exact FFE0/FFE1 (HM-10, JDY-31, CC2541, AT-09)
                                          for (service in gatt.services) {
                                              for (ch in service.characteristics) {
                                                  val uuidStr = ch.uuid.toString().lowercase()
                                                  val props = ch.properties
                                                  val canWrite = (props and BluetoothGattCharacteristic.PROPERTY_WRITE) != 0 ||
                                                                 (props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0
                                                  if (canWrite && uuidStr.startsWith("0000ffe1")) {
                                                      foundChar = ch
                                                      break
                                                  }
                                              }
                                              if (foundChar != null) break
                                          }

                                          // 2. Fallback: Any writable + notifiable UART characteristic
                                          if (foundChar == null) {
                                              for (service in gatt.services) {
                                                  val sUuid = service.uuid.toString().lowercase()
                                                  if (sUuid.startsWith("00001800") || sUuid.startsWith("00001801")) continue
                                                  for (ch in service.characteristics) {
                                                      val props = ch.properties
                                                      val canWrite = (props and BluetoothGattCharacteristic.PROPERTY_WRITE) != 0 ||
                                                                     (props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0
                                                      val canNotify = (props and BluetoothGattCharacteristic.PROPERTY_NOTIFY) != 0
                                                      if (canWrite && canNotify) {
                                                          foundChar = ch
                                                          break
                                                      }
                                                  }
                                                  if (foundChar != null) break
                                              }
                                          }

                                          // 3. Fallback: First writable custom characteristic
                                          if (foundChar == null) {
                                              for (service in gatt.services) {
                                                  val sUuid = service.uuid.toString().lowercase()
                                                  if (sUuid.startsWith("00001800") || sUuid.startsWith("00001801")) continue
                                                  for (ch in service.characteristics) {
                                                      val props = ch.properties
                                                      val canWrite = (props and BluetoothGattCharacteristic.PROPERTY_WRITE) != 0 ||
                                                                     (props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0
                                                      if (canWrite) {
                                                          foundChar = ch
                                                          break
                                                      }
                                                  }
                                                  if (foundChar != null) break
                                              }
                                          }

                                          txCharacteristic = foundChar
                                          isGattReady = foundChar != null
                                          val res = pendingConnectResult
                                          pendingConnectResult = null
                                          if (res != null) {
                                              runOnUiThread {
                                                  if (isGattReady) {
                                                      res.success(true)
                                                  } else {
                                                      res.error("NO_CHAR", "No writable BLE UART characteristic found", null)
                                                  }
                                              }
                                          }
                                      } else {
                                          val res = pendingConnectResult
                                          pendingConnectResult = null
                                          if (res != null) {
                                              runOnUiThread { res.error("DISC_FAIL", "Service discovery failed: $status", null) }
                                          }
                                      }
                                  }
                              }

                              bluetoothGatt = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  device.connectGatt(this, false, callback, BluetoothDevice.TRANSPORT_LE)
                              } else {
                                  device.connectGatt(this, false, callback)
                              }
                          }

                          "send" -> {
                              val rawData = call.argument<String>("data") ?: ""
                              // Append \r\n just like Serial Bluetooth Terminal app
                              val payload = "$rawData\r\n"
                              val gatt = bluetoothGatt
                              val ch = txCharacteristic
                              if (gatt != null && ch != null && isGattReady) {
                                  val bytes = payload.toByteArray(Charsets.UTF_8)
                                  val writeType = if ((ch.properties and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0) {
                                      BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                                  } else {
                                      BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                                  }

                                  val ok = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                      gatt.writeCharacteristic(ch, bytes, writeType) == BluetoothStatusCodes.SUCCESS
                                  } else {
                                      @Suppress("DEPRECATION")
                                      ch.writeType = writeType
                                      @Suppress("DEPRECATION")
                                      ch.value = bytes
                                      @Suppress("DEPRECATION")
                                      gatt.writeCharacteristic(ch)
                                  }

                                  if (ok) {
                                      result.success(true)
                                  } else {
                                      result.error("WRITE_FAIL", "BLE write busy", null)
                                  }
                              } else {
                                  result.error("NOT_CONN", "BLE not connected", null)
                              }
                          }

                          "disconnect" -> {
                              try {
                                  bluetoothGatt?.disconnect()
                                  bluetoothGatt?.close()
                              } catch (_: Exception) {}
                              bluetoothGatt = null
                              txCharacteristic = null
                              isGattReady = false
                              result.success(true)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun startListeningCycle() {
                  if (!isContinuousListening) return
                  mainHandler.post {
                      try {
                          speechRecognizer?.destroy()
                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                          speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {}
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {}

                              override fun onPartialResults(partialResults: Bundle?) {
                                  val partial = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                  if (!partial.isNullOrEmpty()) {
                                      methodChannel?.invokeMethod("onSpeechResult", partial)
                                  }
                              }

                              override fun onResults(results: Bundle?) {
                                  val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                  if (!text.isNullOrEmpty()) {
                                      methodChannel?.invokeMethod("onSpeechResult", text)
                                  }
                                  scheduleNextCycle(250)
                              }

                              override fun onError(error: Int) {
                                  if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                                      isContinuousListening = false
                                      methodChannel?.invokeMethod("onSpeechStatus", "stopped")
                                  } else {
                                      scheduleNextCycle(400)
                                  }
                              }

                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })

                          val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN")
                              putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          }
                          speechRecognizer?.startListening(intent)
                      } catch (_: Exception) {
                          scheduleNextCycle(600)
                      }
                  }
              }

              private fun scheduleNextCycle(delayMs: Long) {
                  if (!isContinuousListening) return
                  mainHandler.postDelayed({ startListeningCycle() }, delayMs)
              }

              override fun onDestroy() {
                  isContinuousListening = false
                  speechRecognizer?.destroy()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoboCar-Controller-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
