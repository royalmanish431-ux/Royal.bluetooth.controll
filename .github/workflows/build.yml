name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: 'stable'

      - name: Initialize Android Platform Files
        run: flutter create --platforms=android --project-name hc05_rover_controller .

      - name: Configure App Name, Stable BLE Queue, CCCD Notify, Gamepad & Voice
        run: |
          flutter pub get
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="hc05_rover_controller"/android:label="Car Automation"/g' "$MANIFEST"
          sed -i 's/<application/<uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" \/>\n        <\/intent>\n    <\/queries>\n    <application/' "$MANIFEST"

          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          cat << 'EOF' > "$MAIN_KT"
          package com.example.hc05_rover_controller

          import android.annotation.SuppressLint
          import android.bluetooth.*
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.view.InputDevice
          import android.view.KeyEvent
          import android.view.MotionEvent
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.UUID
          import java.util.concurrent.ConcurrentLinkedQueue
          import kotlin.math.abs

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.example.hc05_rover_controller/bluetooth"
              private val CCCD_UUID = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb")
              private var methodChannel: MethodChannel? = null

              private var bluetoothGatt: BluetoothGatt? = null
              private var txCharacteristic: BluetoothGattCharacteristic? = null
              private var pendingConnectResult: MethodChannel.Result? = null
              private var isGattReady = false

              private val writeQueue = ConcurrentLinkedQueue<ByteArray>()
              private var isWriting = false

              private var speechRecognizer: SpeechRecognizer? = null
              private var isContinuousListening = false
              private val mainHandler = Handler(Looper.getMainLooper())
              private var lastGamepadCmd = "S"

              @SuppressLint("MissingPermission")
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)

                  methodChannel?.setMethodCallHandler { call, result ->
                      val manager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                      val adapter: BluetoothAdapter? = manager.adapter

                      when (call.method) {
                          "getBondedDevices" -> {
                              if (adapter == null || !adapter.isEnabled) {
                                  result.error("BT_OFF", "Bluetooth is disabled", null)
                                  return@setMethodCallHandler
                              }
                              val list = adapter.bondedDevices.map { device ->
                                  mapOf("name" to (device.name ?: "Unknown"), "address" to device.address)
                              }
                              result.success(list)
                          }

                          "startContinuousVoice" -> {
                              if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                                  result.error("NO_SPEECH", "Speech recognition unavailable", null)
                                  return@setMethodCallHandler
                              }
                              isContinuousListening = true
                              startListeningCycle()
                              result.success(true)
                          }

                          "stopContinuousVoice" -> {
                              isContinuousListening = false
                              try {
                                  speechRecognizer?.stopListening()
                                  speechRecognizer?.destroy()
                              } catch (_: Exception) {}
                              speechRecognizer = null
                              result.success(true)
                          }

                          "connect" -> {
                              val address = call.argument<String>("address")
                              if (adapter == null || address == null) {
                                  result.error("INVALID", "Adapter or address missing", null)
                                  return@setMethodCallHandler
                              }

                              cleanupGatt()
                              pendingConnectResult = result

                              val device: BluetoothDevice = adapter.getRemoteDevice(address)
                              val callback = object : BluetoothGattCallback() {
                                  override fun onConnectionStateChange(gatt: BluetoothGatt, status: Int, newState: Int) {
                                      if (newState == BluetoothProfile.STATE_CONNECTED) {
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                                              gatt.requestConnectionPriority(BluetoothGatt.CONNECTION_PRIORITY_HIGH)
                                          }
                                          mainHandler.postDelayed({
                                              try { gatt.discoverServices() } catch (_: Exception) {}
                                          }, 250)
                                      } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                                          isGattReady = false
                                          txCharacteristic = null
                                          writeQueue.clear()
                                          isWriting = false
                                          val res = pendingConnectResult
                                          pendingConnectResult = null
                                          if (res != null) {
                                              runOnUiThread { res.error("BLE_DISC", "BLE disconnected (status $status)", null) }
                                          }
                                      }
                                  }

                                  override fun onServicesDiscovered(gatt: BluetoothGatt, status: Int) {
                                      if (status == BluetoothGatt.GATT_SUCCESS) {
                                          var foundChar: BluetoothGattCharacteristic? = null

                                          for (service in gatt.services) {
                                              for (ch in service.characteristics) {
                                                  val uuidStr = ch.uuid.toString().lowercase()
                                                  val props = ch.properties
                                                  val canWrite = (props and BluetoothGattCharacteristic.PROPERTY_WRITE) != 0 ||
                                                                 (props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0
                                                  if (canWrite && uuidStr.startsWith("0000ffe1")) {
                                                      foundChar = ch
                                                      break
                                                  }
                                              }
                                              if (foundChar != null) break
                                          }

                                          if (foundChar == null) {
                                              for (service in gatt.services) {
                                                  val sUuid = service.uuid.toString().lowercase()
                                                  if (sUuid.startsWith("00001800") || sUuid.startsWith("00001801")) continue
                                                  for (ch in service.characteristics) {
                                                      val props = ch.properties
                                                      val canWrite = (props and BluetoothGattCharacteristic.PROPERTY_WRITE) != 0 ||
                                                                     (props and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0
                                                      if (canWrite) {
                                                          foundChar = ch
                                                          break
                                                      }
                                                  }
                                                  if (foundChar != null) break
                                              }
                                          }

                                          txCharacteristic = foundChar
                                          if (foundChar != null) {
                                              enableNotifications(gatt, foundChar)
                                              isGattReady = true
                                              val res = pendingConnectResult
                                              pendingConnectResult = null
                                              if (res != null) {
                                                  mainHandler.postDelayed({
                                                      res.success(true)
                                                  }, 200)
                                              }
                                          } else {
                                              val res = pendingConnectResult
                                              pendingConnectResult = null
                                              if (res != null) {
                                                  runOnUiThread { res.error("NO_CHAR", "No writable BLE characteristic found", null) }
                                              }
                                          }
                                      } else {
                                          val res = pendingConnectResult
                                          pendingConnectResult = null
                                          if (res != null) {
                                              runOnUiThread { res.error("DISC_FAIL", "Service discovery failed: $status", null) }
                                          }
                                      }
                                  }

                                  override fun onCharacteristicWrite(
                                      gatt: BluetoothGatt,
                                      characteristic: BluetoothGattCharacteristic,
                                      status: Int
                                  ) {
                                      mainHandler.postDelayed({
                                          isWriting = false
                                          processNextWrite()
                                      }, 30)
                                  }
                              }

                              bluetoothGatt = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  device.connectGatt(this, false, callback, BluetoothDevice.TRANSPORT_LE)
                              } else {
                                  device.connectGatt(this, false, callback)
                              }
                          }

                          "send" -> {
                              val rawData = call.argument<String>("data") ?: ""
                              val payload = "$rawData\r\n"
                              if (bluetoothGatt != null && txCharacteristic != null && isGattReady) {
                                  if (writeQueue.size > 3) writeQueue.clear()
                                  writeQueue.add(payload.toByteArray(Charsets.UTF_8))
                                  processNextWrite()
                                  result.success(true)
                              } else {
                                  result.error("NOT_CONN", "BLE not connected", null)
                              }
                          }

                          "disconnect" -> {
                              cleanupGatt()
                              result.success(true)
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              @SuppressLint("MissingPermission")
              private fun enableNotifications(gatt: BluetoothGatt, ch: BluetoothGattCharacteristic) {
                  try {
                      if ((ch.properties and BluetoothGattCharacteristic.PROPERTY_NOTIFY) != 0) {
                          gatt.setCharacteristicNotification(ch, true)
                          val descriptor = ch.getDescriptor(CCCD_UUID)
                          if (descriptor != null) {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                                  gatt.writeDescriptor(descriptor, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE)
                              } else {
                                  @Suppress("DEPRECATION")
                                  descriptor.value = BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE
                                  @Suppress("DEPRECATION")
                                  gatt.writeDescriptor(descriptor)
                              }
                          }
                      }
                  } catch (_: Exception) {}
              }

              @SuppressLint("MissingPermission")
              private fun processNextWrite() {
                  if (isWriting) return
                  val bytes = writeQueue.poll() ?: return
                  val gatt = bluetoothGatt ?: return
                  val ch = txCharacteristic ?: return
                  if (!isGattReady) return

                  isWriting = true
                  val writeType = if ((ch.properties and BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE) != 0) {
                      BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE
                  } else {
                      BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT
                  }

                  val started = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      gatt.writeCharacteristic(ch, bytes, writeType) == BluetoothStatusCodes.SUCCESS
                  } else {
                      @Suppress("DEPRECATION")
                      ch.writeType = writeType
                      @Suppress("DEPRECATION")
                      ch.value = bytes
                      @Suppress("DEPRECATION")
                      gatt.writeCharacteristic(ch)
                  }

                  if (!started) {
                      mainHandler.postDelayed({
                          isWriting = false
                          processNextWrite()
                      }, 40)
                  } else if (writeType == BluetoothGattCharacteristic.WRITE_TYPE_NO_RESPONSE) {
                      mainHandler.postDelayed({
                          if (isWriting) {
                              isWriting = false
                              processNextWrite()
                          }
                      }, 45)
                  }
              }

              @SuppressLint("MissingPermission")
              private fun cleanupGatt() {
                  isGattReady = false
                  isWriting = false
                  writeQueue.clear()
                  try {
                      bluetoothGatt?.disconnect()
                      bluetoothGatt?.close()
                  } catch (_: Exception) {}
                  bluetoothGatt = null
                  txCharacteristic = null
              }

              override fun onGenericMotionEvent(event: MotionEvent): Boolean {
                  if ((event.source and InputDevice.SOURCE_JOYSTICK) == InputDevice.SOURCE_JOYSTICK &&
                      event.action == MotionEvent.ACTION_MOVE) {
                      val x = event.getAxisValue(MotionEvent.AXIS_X)
                      val y = event.getAxisValue(MotionEvent.AXIS_Y)
                      val hatX = event.getAxisValue(MotionEvent.AXIS_HAT_X)
                      val hatY = event.getAxisValue(MotionEvent.AXIS_HAT_Y)

                      val activeX = if (abs(hatX) > 0.5f) hatX else x
                      val activeY = if (abs(hatY) > 0.5f) hatY else y

                      val cmd = when {
                          activeY < -0.5f -> "F"
                          activeY > 0.5f -> "B"
                          activeX < -0.5f -> "L"
                          activeX > 0.5f -> "R"
                          else -> "S"
                      }

                      if (cmd != lastGamepadCmd) {
                          lastGamepadCmd = cmd
                          methodChannel?.invokeMethod("onGamepadCommand", cmd)
                      }
                      return true
                  }
                  return super.onGenericMotionEvent(event)
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  val isGamepad = (event.source and InputDevice.SOURCE_GAMEPAD) == InputDevice.SOURCE_GAMEPAD ||
                                  (event.source and InputDevice.SOURCE_DPAD) == InputDevice.SOURCE_DPAD
                  if (isGamepad) {
                      if (event.action == KeyEvent.ACTION_DOWN) {
                          val cmd = when (event.keyCode) {
                              KeyEvent.KEYCODE_DPAD_UP, KeyEvent.KEYCODE_BUTTON_Y -> "F"
                              KeyEvent.KEYCODE_DPAD_DOWN, KeyEvent.KEYCODE_BUTTON_A -> "B"
                              KeyEvent.KEYCODE_DPAD_LEFT, KeyEvent.KEYCODE_BUTTON_X -> "L"
                              KeyEvent.KEYCODE_DPAD_RIGHT, KeyEvent.KEYCODE_BUTTON_B -> "R"
                              else -> null
                          }
                          if (cmd != null && cmd != lastGamepadCmd) {
                              lastGamepadCmd = cmd
                              methodChannel?.invokeMethod("onGamepadCommand", cmd)
                              return true
                          }
                      } else if (event.action == KeyEvent.ACTION_UP) {
                          if (lastGamepadCmd != "S") {
                              lastGamepadCmd = "S"
                              methodChannel?.invokeMethod("onGamepadCommand", "S")
                              return true
                          }
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun startListeningCycle() {
                  if (!isContinuousListening) return
                  mainHandler.post {
                      try {
                          speechRecognizer?.destroy()
                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                          speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(params: Bundle?) {}
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(rmsdB: Float) {}
                              override fun onBufferReceived(buffer: ByteArray?) {}
                              override fun onEndOfSpeech() {}

                              override fun onPartialResults(partialResults: Bundle?) {
                                  val partial = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                  if (!partial.isNullOrEmpty()) {
                                      methodChannel?.invokeMethod("onSpeechResult", partial)
                                  }
                              }

                              override fun onResults(results: Bundle?) {
                                  val text = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                  if (!text.isNullOrEmpty()) {
                                      methodChannel?.invokeMethod("onSpeechResult", text)
                                  }
                                  scheduleNextCycle(250)
                              }

                              override fun onError(error: Int) {
                                  if (error == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                                      isContinuousListening = false
                                      methodChannel?.invokeMethod("onSpeechStatus", "stopped")
                                  } else {
                                      scheduleNextCycle(400)
                                  }
                              }

                              override fun onEvent(eventType: Int, params: Bundle?) {}
                          })

                          val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                              putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-IN")
                              putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                          }
                          speechRecognizer?.startListening(intent)
                      } catch (_: Exception) {
                          scheduleNextCycle(600)
                      }
                  }
              }

              private fun scheduleNextCycle(delayMs: Long) {
                  if (!isContinuousListening) return
                  mainHandler.postDelayed({ startListeningCycle() }, delayMs)
              }

              override fun onDestroy() {
                  isContinuousListening = false
                  speechRecognizer?.destroy()
                  cleanupGatt()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Car-Automation-APK
          path: build/app/outputs/flutter-apk/app-release.apk
