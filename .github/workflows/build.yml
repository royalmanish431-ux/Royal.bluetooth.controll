name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # Dhyan dein: Yahan 'cache: gradle' bilkul mat lagana

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create complete Flutter skeleton
        run: |
          flutter create temp_app --org com.royal.controller
          cp -r temp_app/android ./android
          rm -rf temp_app

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Bluetooth-Rover-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
