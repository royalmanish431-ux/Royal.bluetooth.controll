name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Initialize Android Platform Files
        run: flutter create --platforms=android --project-name hc05_rover_controller .

      - name: Fix Gradle Namespace & Permissions for Legacy Bluetooth Plugin
        run: |
          flutter pub get
          # Fix namespace error in flutter_bluetooth_serial for AGP 8+
          PLUGIN_BUILD_GRADLE=$(find ~/.pub-cache -name "build.gradle" | grep "flutter_bluetooth_serial")
          if [ -n "$PLUGIN_BUILD_GRADLE" ]; then
            sed -i 's/android {/android {\n    namespace "io.github.edufolly.flutterbluetoothserial"/' "$PLUGIN_BUILD_GRADLE"
          fi
          # Inject Bluetooth & Mic Permissions into generated AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.BLUETOOTH" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" \/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <application/' "$MANIFEST"

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoboCar-Controller-APK
          path: build/app/outputs/flutter-apk/app-release.apk
